name: Candidate packages

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows-firmware:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install build dependency
        run: python -m pip install platformio==6.1.18
      - name: Test packaging failure boundaries
        run: python scripts/test_release_packaging.py
      - name: Build, verify and package Windows, firmware and sources
        shell: pwsh
        run: powershell -NoProfile -File scripts/package_windows_local.ps1 -Firmware -OutputDirectory artifacts/candidate-windows-firmware
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-windows-firmware
          path: artifacts/candidate-windows-firmware/*
          if-no-files-found: error
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test, package and verify Apple Silicon app
        run: bash scripts/package_macos.sh artifacts/candidate-macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-macos-arm64
          path: artifacts/candidate-macos/*
          if-no-files-found: error
