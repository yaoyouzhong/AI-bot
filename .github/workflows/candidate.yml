name: Candidate packages

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to package
        type: choice
        options: [bundle, bridge, esp8266]
        default: bundle
      desktop_platform:
        description: Desktop platform to package
        type: choice
        options: [all, windows, macos]
        default: all
  workflow_call:
    inputs:
      component:
        type: string
        required: false
        default: bundle
      desktop_platform:
        type: string
        required: false
        default: all

permissions:
  contents: read

jobs:
  windows:
    if: inputs.component == 'bundle' || (inputs.component == 'bridge' && inputs.desktop_platform != 'macos')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test packaging failure boundaries
        run: python scripts/test_release_packaging.py
      - name: Build, verify and package bridge only
        shell: pwsh
        run: powershell -NoProfile -File scripts/package_windows_local.ps1 -OutputDirectory artifacts/candidate-windows-bridge
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-windows-bridge
          path: artifacts/candidate-windows-bridge/*
          if-no-files-found: error
  firmware:
    if: inputs.component == 'bundle' || inputs.component == 'esp8266'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install firmware build dependency
        run: python -m pip install platformio==6.1.18
      - name: Test packaging failure boundaries
        run: python scripts/test_release_packaging.py
      - name: Build, verify and package ESP8266 only
        run: python scripts/package_esp8266_local.py artifacts/candidate-esp8266
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-esp8266
          path: artifacts/candidate-esp8266/*
          if-no-files-found: error
  macos:
    if: inputs.component == 'bundle' || (inputs.component == 'bridge' && inputs.desktop_platform != 'windows')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test, package and verify Apple Silicon app
        run: bash scripts/package_macos.sh artifacts/candidate-macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-macos-arm64
          path: artifacts/candidate-macos/*
          if-no-files-found: error
  macos-source:
    if: inputs.component == 'bridge' && inputs.desktop_platform == 'macos'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify and archive corresponding source
        run: python scripts/package_desktop_source.py artifacts/candidate-macos-source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-macos-source
          path: artifacts/candidate-macos-source/*
          if-no-files-found: error
