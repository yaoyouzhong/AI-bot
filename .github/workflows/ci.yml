name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify version metadata
        run: python scripts/check_version.py
      - name: Build Windows bridge
        run: dotnet build windows-app/AIBotBridge/AIBotBridge.csproj -c Release
      - name: Validate status JSON
        shell: pwsh
        run: |
          $json = dotnet run --no-build -c Release --project windows-app/AIBotBridge/AIBotBridge.csproj -- --status-once
          $status = $json | ConvertFrom-Json
          if ($status.version -ne 1) { throw "Unexpected status version" }

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Build firmware
        run: python -m platformio run -d firmware
