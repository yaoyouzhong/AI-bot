name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.scope.outputs.windows }}
      macos: ${{ steps.scope.outputs.macos }}
      firmware: ${{ steps.scope.outputs.firmware }}
      tools: ${{ steps.scope.outputs.tools }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/ci_scope.py --base "$BASE_SHA" --head "$HEAD_SHA"

  tooling:
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate the alignment delivery policy
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          policy = json.loads(Path("ops/delivery.json").read_text(encoding="utf-8"))
          expected = {
              "repo": "yaoyouzhong/AI-bot",
              "internal": [],
              "check": {"workflow": "ci.yml", "job": "alignment-check"},
              "review": {"points": "docs/DESKTOP-DEVELOPMENT-RELEASE.md"},
          }
          if policy != expected:
              raise SystemExit("Unexpected alignment delivery policy")
          points = Path(policy["review"]["points"]).read_text(encoding="utf-8")
          if "\n## 审查要点\n" not in points:
              raise SystemExit("Missing project review guidance")
          PYTHON
      - name: Release contracts and public content; no product rebuild
        run: |
          python scripts/check_version.py --component all
          python scripts/check_public_content.py --self-test
          python scripts/check_public_content.py
          python docs/development/tab5-279-source/verify.py
          python scripts/test_release_pipeline.py
          python scripts/test_product_release.py
          python scripts/test_product_promotion.py
          python scripts/test_upload_release_resumable.py
          python scripts/test_release_packaging.py
          python scripts/test_download_catalog.py
          python scripts/test_extract_release_notes.py
          python scripts/test_component_versions.py
          python scripts/test_artifact_names.py

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build Windows bridge
        run: dotnet build windows-app/AIBotBridge/AIBotBridge.csproj -c Release
      - name: Validate Windows status snapshot
        run: dotnet run --no-build -c Release --project windows-app/AIBotBridge/AIBotBridge.csproj -- --status-once
      - name: Validate fresh-profile pages and fixture regressions
        shell: pwsh
        run: |
          dotnet run --no-build -c Release --project windows-app/AIBotBridge/AIBotBridge.csproj -- --self-test-public

  macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    env:
      # The pinned MMKV package requires Swift tools 6.2 or newer.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Test macOS bridge
        working-directory: mac-app
        run: swift test
      - name: Build macOS bridge
        working-directory: mac-app
        run: swift build -c release

  firmware:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Build firmware
        run: python -m platformio run -d esp8266

  alignment-check:
    if: always() && github.event_name == 'pull_request'
    needs: [changes, tooling, windows, macos, firmware]
    runs-on: ubuntu-latest
    steps:
      - name: Require the CI jobs selected for this pull request
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          TOOLS_SELECTED: ${{ needs.changes.outputs.tools }}
          TOOLS_RESULT: ${{ needs.tooling.result }}
          WINDOWS_SELECTED: ${{ needs.changes.outputs.windows }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MACOS_SELECTED: ${{ needs.changes.outputs.macos }}
          MACOS_RESULT: ${{ needs.macos.result }}
          FIRMWARE_SELECTED: ${{ needs.changes.outputs.firmware }}
          FIRMWARE_RESULT: ${{ needs.firmware.result }}
        run: |
          test "$SCOPE_RESULT" = success
          for job in TOOLS WINDOWS MACOS FIRMWARE; do
            selected="${job}_SELECTED"
            outcome="${job}_RESULT"
            case "${!selected}:${!outcome}" in
              true:success|false:skipped) ;;
              *) echo "::error::${job} CI did not complete as required"; exit 1 ;;
            esac
          done
