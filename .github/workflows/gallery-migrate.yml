name: Correct and verify gallery archives

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate metadata-only correction
        run: python scripts/test_gallery_edition_migration.py
      - name: Correct metadata, upload and verify each part
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/migrate_gallery_parts.py
