name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Windows bridge
        shell: pwsh
        run: |
          dotnet publish windows-app/AIBotBridge/AIBotBridge.csproj -c Release -r win-x64 --self-contained false -o artifacts/windows
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md artifacts/windows
          Compress-Archive -Path artifacts/windows/* -DestinationPath "AIBotBridge-${{ github.ref_name }}-win-x64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: AIBotBridge-${{ github.ref_name }}-win-x64.zip
          if-no-files-found: error

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.12"
      - name: Verify tag and version
        run: python scripts/check_version.py --tag "${GITHUB_REF_NAME}"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Build firmware
        run: python -m platformio run -d firmware
      - name: Stage firmware
        run: cp firmware/.pio/build/nodemcuv2/firmware.bin "AI-bot-${GITHUB_REF_NAME}-esp8266.bin"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware
          path: AI-bot-${{ github.ref_name }}-esp8266.bin
          if-no-files-found: error

  publish:
    needs: [windows, firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Prepare release metadata
        run: |
          cp LICENSE THIRD_PARTY_NOTICES.md release-assets/
          python scripts/extract_release_notes.py "${GITHUB_REF_NAME}" release-notes.md
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --verify-tag --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
