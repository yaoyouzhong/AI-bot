name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify tag and finalized notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/check_version.py --tag "$RELEASE_TAG"
          python scripts/extract_release_notes.py "$RELEASE_TAG" release-notes.md --require-final
  packages:
    needs: validate
    uses: ./.github/workflows/candidate.yml
  draft:
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: candidate-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete assets and prepare metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python scripts/prepare_release_assets.py release-assets --commit "$SOURCE_SHA"
          python scripts/extract_release_notes.py "$RELEASE_TAG" release-notes.md --require-final
      - name: Create reviewable draft only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "$RELEASE_TAG" --notes-file release-notes.md
