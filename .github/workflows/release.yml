name: Release tag validation
# aibot-tag-validation-only: 1

on:
  push:
    tags:
      - "v*.*.*"
      - "esp8266-v*.*.*"
      - "tab5-v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate metadata only; never rebuild accepted packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/check_version.py --tag "$RELEASE_TAG"
          python scripts/extract_release_notes.py "$RELEASE_TAG" release-notes.md --require-final
          echo 'Promote sealed candidates using scripts/release_pipeline.py or promote.yml. A tag never builds or publishes packages.'
