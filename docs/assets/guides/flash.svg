<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="710" viewBox="0 0 1000 710" role="img"><title>小屏刷机：先确认，再写入</title><rect width="1000" height="710" rx="20" fill="#f3f7f8"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="40" y="55" font-size="30" font-weight="700" fill="#163c46">小屏刷机：先确认，再写入</text><text x="40" y="90" font-size="18" fill="#536b72">操作路线示意 · 只适用于本项目 ESP8266 / ST7789 硬件</text><rect x="32" y="120" width="936" height="96" rx="12" fill="white" stroke="#d8e4e7"/><circle cx="76" cy="165" r="23" fill="#197f89"/><text x="76" y="173" font-size="23" text-anchor="middle" fill="white">1</text><text x="118" y="156" font-size="24" font-weight="600" fill="#163c46">核对型号 → 下载并完整解压固件包</text><text x="118" y="190" font-size="19" fill="#536b72">不确定硬件时先问卖家；找到顶层 firmware.bin。</text><rect x="32" y="232" width="936" height="96" rx="12" fill="white" stroke="#d8e4e7"/><circle cx="76" cy="277" r="23" fill="#197f89"/><text x="76" y="285" font-size="23" text-anchor="middle" fill="white">2</text><text x="118" y="268" font-size="24" font-weight="600" fill="#163c46">准备工具 → 退出 AI-bot → 确认 COM 号</text><text x="118" y="302" font-size="19" fill="#536b72">使用数据线；端口通过插拔设备对照确认。</text><rect x="32" y="344" width="936" height="96" rx="12" fill="white" stroke="#d8e4e7"/><circle cx="76" cy="389" r="23" fill="#197f89"/><text x="76" y="397" font-size="23" text-anchor="middle" fill="white">3</text><text x="118" y="380" font-size="24" font-weight="600" fill="#163c46">识别芯片 → 保存整片备份</text><text x="118" y="414" font-size="19" fill="#536b72">先成功读出备份并另存，再继续写入。</text><rect x="32" y="456" width="936" height="96" rx="12" fill="white" stroke="#d8e4e7"/><circle cx="76" cy="501" r="23" fill="#197f89"/><text x="76" y="509" font-size="23" text-anchor="middle" fill="white">4</text><text x="118" y="492" font-size="24" font-weight="600" fill="#163c46">写入 firmware.bin → 等待校验完成</text><text x="118" y="526" font-size="19" fill="#536b72">100% + Hash of data verified；过程中不要拔线。</text><rect x="32" y="568" width="936" height="96" rx="12" fill="white" stroke="#d8e4e7"/><circle cx="76" cy="613" r="23" fill="#197f89"/><text x="76" y="621" font-size="23" text-anchor="middle" fill="white">5</text><text x="118" y="604" font-size="24" font-weight="600" fill="#163c46">启动电脑应用 → 查看设备信息 → 实体屏切页</text><text x="118" y="638" font-size="19" fill="#536b72">最后恢复智能跟随和循环展示。</text></g></svg>