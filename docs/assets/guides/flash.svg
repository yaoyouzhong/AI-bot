<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780" role="img"><title>ESP8266：刷写与成功确认</title><rect width="900" height="780" rx="20" fill="#091b2b"/><text x="36" y="49" fill="#e4f5ff" font-size="30" font-family="Segoe UI,Microsoft YaHei,sans-serif">ESP8266：刷写与成功确认</text><text x="36" y="82" fill="#98b3c5" font-size="17" font-family="Segoe UI,Microsoft YaHei,sans-serif">适用于本仓库 nodemcuv2 / ST7789 SD2 引脚配置。</text><circle cx="56" cy="141" r="23" fill="#153e50" stroke="#78e5ed"/><text x="49" y="148" fill="#78e5ed" font-size="22" font-family="Segoe UI,Microsoft YaHei,sans-serif">1</text><text x="99" y="139" fill="#e4f5ff" font-size="23" font-family="Segoe UI,Microsoft YaHei,sans-serif">核对硬件与固件版本</text><text x="99" y="173" fill="#b6cbd9" font-size="18" font-family="Segoe UI,Microsoft YaHei,sans-serif">240×240 ST7789；屏幕引脚须与 platformio.ini 一致。</text><circle cx="56" cy="246" r="23" fill="#153e50" stroke="#78e5ed"/><text x="49" y="253" fill="#78e5ed" font-size="22" font-family="Segoe UI,Microsoft YaHei,sans-serif">2</text><text x="99" y="244" fill="#e4f5ff" font-size="23" font-family="Segoe UI,Microsoft YaHei,sans-serif">保留回退材料，释放串口</text><text x="99" y="278" fill="#b6cbd9" font-size="18" font-family="Segoe UI,Microsoft YaHei,sans-serif">备份旧固件来源和设置；退出桥接、串口监视器。</text><circle cx="56" cy="351" r="23" fill="#153e50" stroke="#78e5ed"/><text x="49" y="358" fill="#78e5ed" font-size="22" font-family="Segoe UI,Microsoft YaHei,sans-serif">3</text><text x="99" y="349" fill="#e4f5ff" font-size="23" font-family="Segoe UI,Microsoft YaHei,sans-serif">插入 USB 数据线，查真实 COM 号</text><text x="99" y="383" fill="#b6cbd9" font-size="18" font-family="Segoe UI,Microsoft YaHei,sans-serif">设备管理器 → 端口；对比插拔前后新增的 CH340。</text><circle cx="56" cy="456" r="23" fill="#153e50" stroke="#78e5ed"/><text x="49" y="463" fill="#78e5ed" font-size="22" font-family="Segoe UI,Microsoft YaHei,sans-serif">4</text><text x="99" y="454" fill="#e4f5ff" font-size="23" font-family="Segoe UI,Microsoft YaHei,sans-serif">先构建，再指定串口上传</text><text x="99" y="488" fill="#b6cbd9" font-size="18" font-family="Segoe UI,Microsoft YaHei,sans-serif">PlatformIO 负责板卡参数；不要套用 ESP32 地址或擦除全片。</text><circle cx="56" cy="561" r="23" fill="#153e50" stroke="#78e5ed"/><text x="49" y="568" fill="#78e5ed" font-size="22" font-family="Segoe UI,Microsoft YaHei,sans-serif">5</text><text x="99" y="559" fill="#e4f5ff" font-size="23" font-family="Segoe UI,Microsoft YaHei,sans-serif">重启并启动桥接</text><text x="99" y="593" fill="#b6cbd9" font-size="18" font-family="Segoe UI,Microsoft YaHei,sans-serif">上传成功之后，还要看到 USB 握手和设备页面切换。</text><circle cx="56" cy="666" r="23" fill="#153e50" stroke="#78e5ed"/><text x="49" y="673" fill="#78e5ed" font-size="22" font-family="Segoe UI,Microsoft YaHei,sans-serif">6</text><text x="99" y="664" fill="#e4f5ff" font-size="23" font-family="Segoe UI,Microsoft YaHei,sans-serif">恢复自动与轮播</text><text x="99" y="698" fill="#b6cbd9" font-size="18" font-family="Segoe UI,Microsoft YaHei,sans-serif">保留原有页面、顺序、间隔；不要停在最后一个测试页。</text><text x="36" y="761" fill="#8eaabb" font-size="13" font-family="Segoe UI,Microsoft YaHei,sans-serif">AI-bot · 操作示意图 / Workflow diagram · 非操作截图</text></svg>
