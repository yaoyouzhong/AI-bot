<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="710" viewBox="0 0 1000 710" role="img"><title>Windows ZIP 手动安装：只做这 5 步</title><rect width="1000" height="710" rx="20" fill="#f3f7f8"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="40" y="55" font-size="30" font-weight="700" fill="#163c46">Windows ZIP 手动安装：只做这 5 步</text><text x="40" y="90" font-size="18" fill="#536b72">操作路线示意 · 无需源码构建</text><rect x="32" y="120" width="936" height="96" rx="12" fill="white" stroke="#d8e4e7"/><circle cx="76" cy="165" r="23" fill="#197f89"/><text x="76" y="173" font-size="23" text-anchor="middle" fill="white">1</text><text x="118" y="156" font-size="24" font-weight="600" fill="#163c46">下载 win-x64.zip</text><text x="118" y="190" font-size="19" fill="#536b72">Windows 应用包；不要选 Mac、source 或 .sha256 文件。</text><rect x="32" y="232" width="936" height="96" rx="12" fill="white" stroke="#d8e4e7"/><circle cx="76" cy="277" r="23" fill="#197f89"/><text x="76" y="285" font-size="23" text-anchor="middle" fill="white">2</text><text x="118" y="268" font-size="24" font-weight="600" fill="#163c46">首次准备运行环境（已有可跳过）</text><text x="118" y="302" font-size="19" fill="#536b72">.NET 8 桌面运行时；WebView2 在网页授权需要时补装。</text><rect x="32" y="344" width="936" height="96" rx="12" fill="white" stroke="#d8e4e7"/><circle cx="76" cy="389" r="23" fill="#197f89"/><text x="76" y="397" font-size="23" text-anchor="middle" fill="white">3</text><text x="118" y="380" font-size="24" font-weight="600" fill="#163c46">右键 ZIP → 全部解压</text><text x="118" y="414" font-size="19" fill="#536b72">保留 EXE、DLL、runtimes 和其他全部文件。</text><rect x="32" y="456" width="936" height="96" rx="12" fill="white" stroke="#d8e4e7"/><circle cx="76" cy="501" r="23" fill="#197f89"/><text x="76" y="509" font-size="23" text-anchor="middle" fill="white">4</text><text x="118" y="492" font-size="24" font-weight="600" fill="#163c46">双击 AIBotBridge.exe</text><text x="118" y="526" font-size="19" fill="#536b72">去右下角托盘找图标：左键看镜像，右键开菜单。</text><rect x="32" y="568" width="936" height="96" rx="12" fill="white" stroke="#d8e4e7"/><circle cx="76" cy="613" r="23" fill="#197f89"/><text x="76" y="621" font-size="23" text-anchor="middle" fill="white">5</text><text x="118" y="604" font-size="24" font-weight="600" fill="#163c46">连接 USB 数据线 → 查看设备信息</text><text x="118" y="638" font-size="19" fill="#536b72">实体屏能更新和切页，才算连接成功。</text></g></svg>