<svg xmlns="http://www.w3.org/2000/svg" width="900" height="675" viewBox="0 0 900 675" role="img"><title>Windows：从源码到桌面小屏</title><rect width="900" height="675" rx="20" fill="#091b2b"/><text x="36" y="49" fill="#e4f5ff" font-size="30" font-family="Segoe UI,Microsoft YaHei,sans-serif">Windows：从源码到桌面小屏</text><text x="36" y="82" fill="#98b3c5" font-size="17" font-family="Segoe UI,Microsoft YaHei,sans-serif">当前没有正式 Release；按手册构建候选包，再完整解压。</text><circle cx="56" cy="141" r="23" fill="#153e50" stroke="#78e5ed"/><text x="49" y="148" fill="#78e5ed" font-size="22" font-family="Segoe UI,Microsoft YaHei,sans-serif">1</text><text x="99" y="139" fill="#e4f5ff" font-size="23" font-family="Segoe UI,Microsoft YaHei,sans-serif">获取源码与构建环境</text><text x="99" y="173" fill="#b6cbd9" font-size="18" font-family="Segoe UI,Microsoft YaHei,sans-serif">Git + Python + .NET 8 SDK；运行本地打包脚本。</text><circle cx="56" cy="246" r="23" fill="#153e50" stroke="#78e5ed"/><text x="49" y="253" fill="#78e5ed" font-size="22" font-family="Segoe UI,Microsoft YaHei,sans-serif">2</text><text x="99" y="244" fill="#e4f5ff" font-size="23" font-family="Segoe UI,Microsoft YaHei,sans-serif">完整解压 Windows ZIP</text><text x="99" y="278" fill="#b6cbd9" font-size="18" font-family="Segoe UI,Microsoft YaHei,sans-serif">保留 DLL、runtimes、许可；安装 Desktop Runtime 与 WebView2。</text><circle cx="56" cy="351" r="23" fill="#153e50" stroke="#78e5ed"/><text x="49" y="358" fill="#78e5ed" font-size="22" font-family="Segoe UI,Microsoft YaHei,sans-serif">3</text><text x="99" y="349" fill="#e4f5ff" font-size="23" font-family="Segoe UI,Microsoft YaHei,sans-serif">退出旧桥接，再启动 AIBotBridge.exe</text><text x="99" y="383" fill="#b6cbd9" font-size="18" font-family="Segoe UI,Microsoft YaHei,sans-serif">右下角托盘运行；左键打开镜像，右键打开功能菜单。</text><circle cx="56" cy="456" r="23" fill="#153e50" stroke="#78e5ed"/><text x="49" y="463" fill="#78e5ed" font-size="22" font-family="Segoe UI,Microsoft YaHei,sans-serif">4</text><text x="99" y="454" fill="#e4f5ff" font-size="23" font-family="Segoe UI,Microsoft YaHei,sans-serif">连接已刷 AI-bot 固件的设备</text><text x="99" y="488" fill="#b6cbd9" font-size="18" font-family="Segoe UI,Microsoft YaHei,sans-serif">使用 USB 数据线；串口自动识别，核实握手与页面切换。</text><circle cx="56" cy="561" r="23" fill="#153e50" stroke="#78e5ed"/><text x="49" y="568" fill="#78e5ed" font-size="22" font-family="Segoe UI,Microsoft YaHei,sans-serif">5</text><text x="99" y="559" fill="#e4f5ff" font-size="23" font-family="Segoe UI,Microsoft YaHei,sans-serif">按需启用内容</text><text x="99" y="593" fill="#b6cbd9" font-size="18" font-family="Segoe UI,Microsoft YaHei,sans-serif">先看系统监控与默认桌宠，再配置天气、股票及厂商授权。</text><text x="36" y="656" fill="#8eaabb" font-size="13" font-family="Segoe UI,Microsoft YaHei,sans-serif">AI-bot · 操作示意图 / Workflow diagram · 非操作截图</text></svg>
