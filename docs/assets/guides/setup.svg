<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="710" viewBox="0 0 1000 710" role="img"><title>Windows 联网精简安装：按提示完成</title><rect width="1000" height="710" rx="20" fill="#f3f7f8"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="40" y="55" font-size="30" font-weight="700" fill="#163c46">Windows 联网精简安装：按提示完成</text><text x="40" y="90" font-size="18" fill="#536b72">操作步骤示意 · 安装包约 8 MB · 缺少组件时需要联网</text><rect x="32" y="120" width="936" height="96" rx="12" fill="white" stroke="#d8e4e7"/><circle cx="76" cy="165" r="23" fill="#197f89"/><text x="76" y="173" font-size="23" text-anchor="middle" fill="white">1</text><text x="118" y="156" font-size="24" font-weight="600" fill="#163c46">下载 setup-win-x64.exe → 双击打开</text><text x="118" y="190" font-size="19" fill="#536b72">不用手动解压，也不用自行寻找运行环境下载按钮。</text><rect x="32" y="232" width="936" height="96" rx="12" fill="white" stroke="#d8e4e7"/><circle cx="76" cy="277" r="23" fill="#197f89"/><text x="76" y="285" font-size="23" text-anchor="middle" fill="white">2</text><text x="118" y="268" font-size="24" font-weight="600" fill="#163c46">阅读许可 → 保留默认安装位置</text><text x="118" y="302" font-size="19" fill="#536b72">按需要选择桌面快捷方式，然后点“下一步”。</text><rect x="32" y="344" width="936" height="96" rx="12" fill="white" stroke="#d8e4e7"/><circle cx="76" cy="389" r="23" fill="#197f89"/><text x="76" y="397" font-size="23" text-anchor="middle" fill="white">3</text><text x="118" y="380" font-size="24" font-weight="600" fill="#163c46">检查运行环境 → 点击“安装”</text><text x="118" y="414" font-size="19" fill="#536b72">已有组件会跳过；缺少时自动下载并补装。</text><rect x="32" y="456" width="936" height="96" rx="12" fill="white" stroke="#d8e4e7"/><circle cx="76" cy="501" r="23" fill="#197f89"/><text x="76" y="509" font-size="23" text-anchor="middle" fill="white">4</text><text x="118" y="492" font-size="24" font-weight="600" fill="#163c46">下载校验通过 → 处理微软安装器提示</text><text x="118" y="526" font-size="19" fill="#536b72">如需管理员许可，请允许或联系单位 IT 管理员。</text><rect x="32" y="568" width="936" height="96" rx="12" fill="white" stroke="#d8e4e7"/><circle cx="76" cy="613" r="23" fill="#197f89"/><text x="76" y="621" font-size="23" text-anchor="middle" fill="white">5</text><text x="118" y="604" font-size="24" font-weight="600" fill="#163c46">点击“完成” → 在右下角托盘找 AI-bot</text><text x="118" y="638" font-size="19" fill="#536b72">左键打开镜像，右键打开菜单；连接小屏后检查实体显示。</text></g></svg>