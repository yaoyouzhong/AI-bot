<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="598" viewBox="0 0 1000 598" role="img"><title>附件很多，你只需选对用途</title><rect width="1000" height="598" rx="20" fill="#f3f7f8"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="40" y="55" font-size="30" font-weight="700" fill="#163c46">附件很多，你只需选对用途</text><text x="40" y="90" font-size="18" fill="#536b72">下载选择示意 · 不是 14 项都要安装</text><rect x="32" y="120" width="936" height="96" rx="12" fill="white" stroke="#d8e4e7"/><circle cx="76" cy="165" r="23" fill="#197f89"/><text x="76" y="173" font-size="23" text-anchor="middle" fill="white">1</text><text x="118" y="156" font-size="24" font-weight="600" fill="#163c46">Windows 电脑 → setup-win-x64.exe</text><text x="118" y="190" font-size="19" fill="#536b72">约 8 MB 联网精简安装包；缺少组件时自动下载。</text><rect x="32" y="232" width="936" height="96" rx="12" fill="white" stroke="#d8e4e7"/><circle cx="76" cy="277" r="23" fill="#197f89"/><text x="76" y="285" font-size="23" text-anchor="middle" fill="white">2</text><text x="118" y="268" font-size="24" font-weight="600" fill="#163c46">M 系列 Mac → macos-arm64.zip</text><text x="118" y="302" font-size="19" fill="#536b72">macOS 13+ 测试版；与 Windows 安装包不能混用。</text><rect x="32" y="344" width="936" height="96" rx="12" fill="white" stroke="#d8e4e7"/><circle cx="76" cy="389" r="23" fill="#197f89"/><text x="76" y="397" font-size="23" text-anchor="middle" fill="white">3</text><text x="118" y="380" font-size="24" font-weight="600" fill="#163c46">首次刷小屏 → firmware-materials.zip</text><text x="118" y="414" font-size="19" fill="#536b72">里面有 firmware.bin；另需对应电脑的应用包。</text><rect x="32" y="456" width="936" height="96" rx="12" fill="white" stroke="#d8e4e7"/><circle cx="76" cy="501" r="23" fill="#197f89"/><text x="76" y="509" font-size="23" text-anchor="middle" fill="white">4</text><text x="118" y="492" font-size="24" font-weight="600" fill="#163c46">其他文件 → 校验、许可、源码</text><text x="118" y="526" font-size="19" fill="#536b72">SHA-256 检查完整性；源码供开发者使用。</text></g></svg>