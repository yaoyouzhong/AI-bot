<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="486" viewBox="0 0 1000 486" role="img"><title>设备管理器：用插拔确认端口</title><rect width="1000" height="486" rx="20" fill="#f3f7f8"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="40" y="55" font-size="30" font-weight="700" fill="#163c46">设备管理器：用插拔确认端口</text><text x="40" y="90" font-size="18" fill="#536b72">示意图，非真实设备截图 · COM5 仅为例子</text><rect x="32" y="120" width="936" height="96" rx="12" fill="white" stroke="#d8e4e7"/><circle cx="76" cy="165" r="23" fill="#197f89"/><text x="76" y="173" font-size="23" text-anchor="middle" fill="white">1</text><text x="118" y="156" font-size="24" font-weight="600" fill="#163c46">① 未插小屏</text><text x="118" y="190" font-size="19" fill="#536b72">端口（COM 和 LPT）中先记住原有条目。</text><rect x="32" y="232" width="936" height="96" rx="12" fill="white" stroke="#d8e4e7"/><circle cx="76" cy="277" r="23" fill="#197f89"/><text x="76" y="285" font-size="23" text-anchor="middle" fill="white">2</text><text x="118" y="268" font-size="24" font-weight="600" fill="#163c46">② 插上数据线 → 新增 USB-SERIAL CH340 (COM5)</text><text x="118" y="302" font-size="19" fill="#536b72">新增项可能显示其他芯片名称；记下括号内 COM 号。</text><rect x="32" y="344" width="936" height="96" rx="12" fill="white" stroke="#d8e4e7"/><circle cx="76" cy="389" r="23" fill="#197f89"/><text x="76" y="397" font-size="23" text-anchor="middle" fill="white">3</text><text x="118" y="380" font-size="24" font-weight="600" fill="#163c46">③ 拔下小屏 → 对应那一行消失</text><text x="118" y="414" font-size="19" fill="#536b72">再插回去；两次对照一致，才选这个端口。</text></g></svg>