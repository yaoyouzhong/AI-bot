<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="486" viewBox="0 0 1000 486" role="img"><title>怎样判断写入成功</title><rect width="1000" height="486" rx="20" fill="#f3f7f8"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="40" y="55" font-size="30" font-weight="700" fill="#163c46">怎样判断写入成功</text><text x="40" y="90" font-size="18" fill="#536b72">输出关键位置示意 · 不是真实刷机日志</text><rect x="32" y="120" width="936" height="96" rx="12" fill="white" stroke="#d8e4e7"/><circle cx="76" cy="165" r="23" fill="#197f89"/><text x="76" y="173" font-size="23" text-anchor="middle" fill="white">1</text><text x="118" y="156" font-size="24" font-weight="600" fill="#163c46">进度到 100%</text><text x="118" y="190" font-size="19" fill="#536b72">只到 100% 还不够，继续等待校验。</text><rect x="32" y="232" width="936" height="96" rx="12" fill="white" stroke="#d8e4e7"/><circle cx="76" cy="277" r="23" fill="#197f89"/><text x="76" y="285" font-size="23" text-anchor="middle" fill="white">2</text><text x="118" y="268" font-size="24" font-weight="600" fill="#163c46">Hash of data verified</text><text x="118" y="302" font-size="19" fill="#536b72">看到这一行，表示写入数据通过校验。</text><rect x="32" y="344" width="936" height="96" rx="12" fill="white" stroke="#d8e4e7"/><circle cx="76" cy="389" r="23" fill="#197f89"/><text x="76" y="397" font-size="23" text-anchor="middle" fill="white">3</text><text x="118" y="380" font-size="24" font-weight="600" fill="#163c46">设备重启 → 返回 PowerShell 提示符</text><text x="118" y="414" font-size="19" fill="#536b72">没有报错后，启动电脑应用并验证实体小屏。</text></g></svg>